name: Build Android APK

on:
  push:
    branches: [ main ] 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Add Android Platform and Assets
        run: |
          npx cap add android
          npm install -D @capacitor/assets
          npx @capacitor/assets generate --android

      - name: Apply Custom Configurations
        run: |
          # 1. Copiar google-services.json
          cp google-services.json android/app/ || true
          
          # 2. Configurar strings.xml
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">Monywissen</string><string name="title_activity_main">Monywissen</string><string name="server_client_id">987859318051-s78uq9pcqseg0u0hlren3tdqbpcrdav2.apps.googleusercontent.com</string></resources>' > android/app/src/main/res/values/strings.xml
          
          # 3. Sobre-escribir styles.xml
          echo '<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@android:color/white</item>
                  <item name="colorPrimaryDark">@android:color/white</item>
                  <item name="colorAccent">@android:color/black</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="windowNoTitle">true</item>
                  <item name="android:windowFullscreen">true</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:background">@drawable/splash</item>
              </style>
          </resources>' > android/app/src/main/res/values/styles.xml

      - name: Inject Google Login Return Intent
        run: |
          # Usamos un sed más seguro para insertar el intent-filter
          sed -i '/<activity/a \
              <intent-filter>\
                  <action android:name="android.intent.action.VIEW" />\
                  <category android:name="android.intent.category.DEFAULT" />\
                  <category android:name="android.intent.category.BROWSABLE" />\
                  <data android:scheme="com.googleusercontent.apps.987859318051-s78uq9pcqseg0u0hlren3tdqbpcrdav2" />\
              </intent-filter>' android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor Project
        run: npx cap sync android

      - name: Build APK (Release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks monywissen-release.jks \
            --ks-key-alias "monywissen" \
            --ks-pass pass:"monywissen" \
            --key-pass pass:"monywissen" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          
          mv android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/Monywissen-Signed.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monywissen-Produccion
          path: android/app/build/outputs/apk/release/Monywissen-Signed.apk
          retention-days: 7